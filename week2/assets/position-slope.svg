<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="48" font-size="30" fill="#172b46" text-anchor="start">Position–time: slope tells you velocity</text><line x1="110" y1="125" x2="110" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="110" y="607" font-size="21" fill="#172b46" text-anchor="middle">0</text><line x1="352.5" y1="125" x2="352.5" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="352.5" y="607" font-size="21" fill="#172b46" text-anchor="middle">1</text><line x1="595" y1="125" x2="595" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="595" y="607" font-size="21" fill="#172b46" text-anchor="middle">2</text><line x1="837.5" y1="125" x2="837.5" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="837.5" y="607" font-size="21" fill="#172b46" text-anchor="middle">3</text><line x1="1080" y1="125" x2="1080" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="1080" y="607" font-size="21" fill="#172b46" text-anchor="middle">4</text><line x1="110" y1="575" x2="1080" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="582" font-size="21" fill="#172b46" text-anchor="end">0</text><line x1="110" y1="518.75" x2="1080" y2="518.75" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="525.75" font-size="21" fill="#172b46" text-anchor="end">2</text><line x1="110" y1="462.5" x2="1080" y2="462.5" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="469.5" font-size="21" fill="#172b46" text-anchor="end">4</text><line x1="110" y1="406.25" x2="1080" y2="406.25" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="413.25" font-size="21" fill="#172b46" text-anchor="end">6</text><line x1="110" y1="350" x2="1080" y2="350" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="357" font-size="21" fill="#172b46" text-anchor="end">8</text><line x1="110" y1="293.75" x2="1080" y2="293.75" stroke="#d9e2eb" stroke-width="1" /><text x="92" y