<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="48" font-size="30" fill="#172b46" text-anchor="start">Velocity–time: signed area tells you displacement</text><line x1="110" y1="125" x2="110" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="110" y="607" font-size="21" fill="#172b46" text-anchor="middle">0</text><line x1="352.5" y1="125" x2="352.5" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="352.5" y="607" font-size="21" fill="#172b46" text-anchor="middle">1</text><line x1="595" y1="125" x2="595" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="595" y="607" font-size="21" fill="#172b46" text-anchor="middle">2</text><line x1="837.5" y1="125" x2="837.5" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="837.5" y="607" font-size="21" fill="#172b46" text-anchor="middle">3</text><line x1="1080" y1="125" x2="1080" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="1080" y="607" font-size="21" fill="#172b46" text-anchor="middle">4</text><line x1="110" y1="575" x2="1080" y2="575" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="582" font-size="21" fill="#172b46" text-anchor="end">0</text><line x1="110" y1="510.7142857142857" x2="1080" y2="510.7142857142857" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="517.7142857142858" font-size="21" fill="#172b46" text-anchor="end">1</text><line x1="110" y1="446.42857142857144" x2="1080" y2="446.42857142857144" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="453.42857142857144" font-size="21" fill="#172b46" text-anchor="end">2</text><line x1="110" y1="382.14285714285717" x2="1080" y2="382.14285714285717" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="389.14285714285717" font-size="21" fill="#172b46" text-anchor="end">3</text><line x1="110" y1="317.8571428571429" x2="1080" y2="317.8571428571429" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="324.8571428571429" font-size="21" fill="#172b46" text-anchor="end">4</text><line x1="110" y1="253.57142857142856" x2="1080" y2="253.57142857142856" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="260.57142857142856" font-size="21" fill="#172b46" text-anchor="end">5</text><line x1="110" y1="189.28571428571433" x2="1080" y2="189.28571428571433" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="196.28571428571433" font-size="21" fill="#172b46" text-anchor="end">6</text><line x1="110" y1="125" x2="1080" y2="125" stroke="#d9e2eb" stroke-width="1" /><text x="92" y="132" font-size="21" fill="#172b46" text-anchor="end">7</text><line x1="110" y1="125" x2="110" y2="575" stroke="#172b46" stroke-width="3" /><line x1="110" y1="575" x2="1080" y2="575" stroke="#172b46" stroke-width="3" /><text x="110" y="97" font-size="24" fill="#172b46" text-anchor="start">Velocity (m/s)</text><text x="1080" y="645" font-size="24" fill="#172b46" text-anchor="end">Time (s)</text><polygon points="110,575 110,446.42857142857144 1080,446.42857142857144 1080,575" fill="#dcebf7" stroke="none" stroke-width="3"/><polygon points="110,446.42857142857144 1080,189.28571428571433 1080,446.42857142857144" fill="#f9e1cb" stroke="none" stroke-width="3"/><polyline points="110,446.42857142857144 1080,189.28571428571433" fill="none" stroke="#1766a3" stroke-width="5" /><line x1="110" y1="446.42857142857144" x2="1080" y2="446.42857142857144" stroke="#a64800" stroke-width="2" stroke-dasharray="7 5"/><text x="595" y="510.7142857142857" font-size="25" fill="#1766a3" text-anchor="middle">Rectangle: 2 × 4 = 8 m</text><text x="789" y="356.42857142857144" font-size="23" fill="#a64800" text-anchor="middle">Triangle: ½ × 4 × 4 = 8 m</text><text x="110" y="675" font-size="25" fill="#172b46" text-anchor="start">Displacement = 16 m. Acceleration = (6 − 2) / 4 = +1 m/s².</text></g></svg>