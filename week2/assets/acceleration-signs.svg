<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="48" font-size="30" fill="#172b46" text-anchor="start">Negative acceleration does not always mean slowing down</text><text x="55" y="105" font-size="25" fill="#172b46" text-anchor="start">Speed increases when velocity and acceleration have the same sign.</text><text x="55" y="145" font-size="25" fill="#172b46" text-anchor="start">Speed decreases when their signs are opposite.</text><text x="50" y="240" font-size="25" fill="#172b46" text-anchor="start">Moving right, speeding up</text><text x="540" y="228" font-size="24" fill="#1766a3" text-anchor="start">v</text><line x1="750" y1="220" x2="905" y2="220" stroke="#1766a3" stroke-width="5" /><polygon points="905,220 890,212 890,228" fill="#1766a3" stroke="none" stroke-width="3"/><text x="540" y="270" font-size="24" fill="#a64800" text-anchor="start">a</text><line x1="750" y1="265" x2="860" y2="265" stroke="#a64800" stroke-width="5" /><polygon points="860,265 845,257 845,273" fill="#a64800" stroke="none" stroke-width="3"/><text x="50" y="345" font-size="25" fill="#172b46" text-anchor="start">Moving right, slowing down</text><text x="540" y="333" font-size="24" fill="#1766a3" text-anchor="start">v</text><line x1="750" y1="325" x2="905" y2="325" stroke="#1766a3" stroke-width="5" /><polygon points="905,325 890,317 890,333" fill="#1766a3" stroke="none" stroke-width="3"/><text x="540" y="375" font-size="24" fill="#a64800" text-anchor="start">a</text><line x1="750" y1="370" x2="640" y2="370" stroke="#a64800" stroke-width="5" /><polygon points="640,370 655,362 655,378" fill="#a64800" stroke="none" stroke-width="3"/><text x="50" y="450" font-size="25" fill="#172b46" text-anchor="start">Moving left, speeding up</text><text x="540" y="438" font-size="24" fill="#1766a3" text-anchor="start">v</text><line x1="750" y1="430" x2="595" y2="430" stroke="#1766a3" stroke-width="5" /><polygon points="595,430 610,422 610,438" fill="#1766a3" stroke="none" stroke-width="3"/><text x="540" y="480" font-size="24" fill="#a64800" text-anchor="start">a</text><line x1="750" y1="475" x2="640" y2="475" stroke="#a64800" stroke-width="5" /><polygon points="640,475 655,467 655,483" fill="#a64800" stroke="none" stroke-width="3"/><text x="50" y="555" font-size="25" fill="#172b46" text-anchor="start">Moving left, slowing down</text><text x="540" y="543" font-size="24" fill="#1766a3" text-anchor="start">v</text><line x1="750" y1="535" x2="595" y2="535" stroke="#1766a3" stroke-width="5" /><polygon points="595,535 610,527 610,543" fill="#1766a3" stroke="none" stroke-width="3"/><text x="540" y="585" font-size="24" fill="#a64800" text-anchor="start">a</text><line x1="750" y1="580" x2="860" y2="580" stroke="#a64800" stroke-width="5" /><polygon points="860,580 845,572 845,588" fill="#a64800" stroke="none" stroke-width="3"/><text x="55" y="700" font-size="24" fill="#172b46" text-anchor="start">Negative acceleration means acceleration points in the negative direction.</text></g></svg>