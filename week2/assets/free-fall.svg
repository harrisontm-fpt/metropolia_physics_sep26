<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="48" font-size="30" fill="#172b46" text-anchor="start">Free fall: signs follow the coordinate choice</text><text x="55" y="110" font-size="25" fill="#172b46" text-anchor="start">Upward is positive. A ball is dropped from rest at y₀ = 20 m.</text><line x1="160" y1="585" x2="1020" y2="585" stroke="#172b46" stroke-width="5" /><text x="800" y="625" font-size="25" fill="#172b46" text-anchor="start">Ground: y = 0 m</text><line x1="240" y1="180" x2="240" y2="585" stroke="#172b46" stroke-width="3" /><polygon points="240,170 230,192 250,192" fill="#172b46" stroke="none" stroke-width="3"/><text x="75" y="200" font-size="24" fill="#172b46" text-anchor="start">+y (up)</text><circle cx="570" cy="210" r="10" fill="#1766a3"/><circle cx="570" cy="255" r="10" fill="#1766a3"/><circle cx="570" cy="360" r="10" fill="#1766a3"/><circle cx="570" cy="535" r="10" fill="#1766a3"/><text x="625" y="215" font-size="25" fill="#172b46" text-anchor="start">Release: v₀ = 0</text><text x="625" y="305" font-size="25" fill="#172b46" text-anchor="start">During the fall:</text><text x="625" y="350" font-size="25" fill="#172b46" text-anchor="start">velocity is negative</text><text x="625" y="395" font-size="25" fill="#172b46" text-anchor="start">acceleration a = −g</text><text x="625" y="440" font-size="25" fill="#172b46" text-anchor="start">speed increases</text><text x="55" y="690" font-size="23" fill="#172b46" text-anchor="start">The dots represent equal time steps schematically; stop the model at the ground.</text></g></svg>