<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="48" font-size="30" fill="#172b46" text-anchor="start">Same journey, two different quantities</text><text x="45" y="95" font-size="24" fill="#172b46" text-anchor="start">Choose right as positive. Positions are measured from the same origin.</text><line x1="140" y1="380" x2="980" y2="380" stroke="#172b46" stroke-width="5" /><polygon points="980,380 965,372 965,388" fill="#172b46" stroke="none" stroke-width="3"/><line x1="140" y1="370" x2="140" y2="390" stroke="#172b46" stroke-width="3" /><text x="140" y="425" font-size="22" fill="#172b46" text-anchor="middle">0 m</text><line x1="260" y1="370" x2="260" y2="390" stroke="#172b46" stroke-width="3" /><text x="260" y="425" font-size="22" fill="#172b46" text-anchor="middle">1 m</text><line x1="380" y1="370" x2="380" y2="390" stroke="#172b46" stroke-width="3" /><text x="380" y="425" font-size="22" fill="#172b46" text-anchor="middle">2 m</text><line x1="500" y1="370" x2="500" y2="390" stroke="#172b46" stroke-width="3" /><text x="500" y="425" font-size="22" fill="#172b46" text-anchor="middle">3 m</text><line x1="620" y1="370" x2="620" y2="390" stroke="#172b46" stroke-width="3" /><text x="620" y="425" font-size="22" fill="#172b46" text-anchor="middle">4 m</text><line x1="740" y1="370" x2="740" y2="390" stroke="#172b46" stroke-width="3" /><text x="740" y="425" font-size="22" fill="#172b46" text-anchor="middle">5 m</text><line x1="860" y1="370" x2="860" y2="390" stroke="#172b46" stroke-width="3" /><text x="860" y="425" font-size="22" fill="#172b46" text-anchor="middle">6 m</text><line x1="980" y1="370" x2="980" y2="390" stroke="#172b46" stroke-width="3" /><text x="980" y="425" font-size="22" fill="#172b46" text-anchor="middle">7 m</text><line x1="260" y1="220" x2="860" y2="220" stroke="#1766a3" stroke-width="5" /><polygon points="860,220 845,212 845,228" fill="#1766a3" stroke="none" stroke-width="3"/><text x="560" y="190" font-size="26" fill="#1766a3" text-anchor="middle">1. Walk right: 5 m</text><line x1="860" y1="290" x2="500" y2="290" stroke="#a64800" stroke-width="5" /><polygon points="500,290 515,282 515,298" fill="#a64800" stroke="none" stroke-width="3"/><text x="680" y="265" font-size="26" fill="#a64800" text-anchor="middle">2. Walk left: 3 m</text><circle cx="260" cy="380" r="6" fill="#1766a3"/><circle cx="500" cy="380" r="7" fill="#a64800"/><text x="260" y="475" font-size="24" fill="#1766a3" text-anchor="middle">Start: x = 1 m</text><text x="585" y="515" font-size="24" fill="#a64800" text-anchor="middle">Finish: x = 3 m</text><text x="45" y="590" font-size="29" fill="#172b46" text-anchor="start">Distance = 5 + 3 = 8 m</text><text x="45" y="645" font-size="29" fill="#172b46" text-anchor="start">Displacement = final position − initial position = 3 − 1 = +2 m</text></g></svg>